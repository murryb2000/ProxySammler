name: Build and release ProxySammler
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: proxysammler-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Read release version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and version do not match' }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Restore
        run: |
          dotnet restore ProxySammler.Tests/ProxySammler.Tests.csproj
          dotnet restore ProxySammler/ProxySammler.csproj -r win-x64
      - name: Run all tests
        run: dotnet run --project ProxySammler.Tests/ProxySammler.Tests.csproj -c Release --no-restore
      - name: Publish single-file Windows x64 executable
        run: dotnet publish ProxySammler/ProxySammler.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o release/publish
      - name: Build portable package
        shell: pwsh
        run: |
          $exe = "ProxySammler-$env:VERSION-Windows-x64.exe"
          Copy-Item release/publish/ProxySammler.exe "release/$exe"
          New-Item -ItemType Directory -Force release/package | Out-Null
          Copy-Item "release/$exe" release/package/
          Copy-Item README.txt release/package/
          Copy-Item ProxySammler/sources.txt release/package/
          Compress-Archive -Path release/package/* -DestinationPath "release/ProxySammler-$env:VERSION-Windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ProxySammler-${{ env.VERSION }}-Windows-x64
          path: |
            release/ProxySammler-${{ env.VERSION }}-Windows-x64.exe
            release/ProxySammler-${{ env.VERSION }}-Windows-x64-portable.zip
      - name: Create GitHub Release after successful tests and build
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; keeping published files."; exit 0 }
          gh release create $tag "release/ProxySammler-$env:VERSION-Windows-x64.exe" "release/ProxySammler-$env:VERSION-Windows-x64-portable.zip" --target $env:GITHUB_SHA --title "ProxySammler $env:VERSION" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
